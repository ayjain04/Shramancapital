    <path stroke="url(#g-s)" stroke-width="3.2" d="M 324,206 L 164,206 A 28,28 0 0,0 136,234  L 136,372  A 28,28 0 0,0 164,400 L 296,400 A 28,28 0 0,1 324,428 L 324,566 A 28,28 0 0,1 296,594 L 136,594"/>
    <path stroke="url(#g-s)" stroke-width="3.2" d="M 310,220 L 174,220 A 24,24 0 0,0 150,244  L 150,376  A 24,24 0 0,0 174,400 L 286,400 A 24,24 0 0,1 310,424 L 310,556 A 24,24 0 0,1 286,580 L 150,580"/>

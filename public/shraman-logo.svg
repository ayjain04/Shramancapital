<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Shraman Capital Mark</title>
  <rect width="800" height="800" fill="#1a5c3a"/>

  <defs>
    <linearGradient id="g-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="white" stop-opacity="1"/>
      <stop offset="80%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="g-c" x1="1" y1="0" x2="0" y2="0.5">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!--
      CORRECTED S GLYPH:
      A proper "S" reads top-to-bottom as:
        - Top horizontal goes RIGHT
        - But the top arch opens to the RIGHT (top hooks LEFT, going from top-right down-left)
      
      Wait - let me think about this carefully.
      Standard "S" letter:
        - Top loop: opens to the LOWER-LEFT (the top arch curves from upper-right around to lower-left)
        - Bottom loop: opens to the UPPER-RIGHT (the bottom arch curves from lower-left around to upper-right)
      
      Drawing S top-down with strokes:
        1. Start at top-RIGHT
        2. Go LEFT along top
        3. Curve DOWN at top-LEFT corner
        4. Go DOWN along left side (short — half height)
        5. Curve RIGHT at mid-LEFT
        6. Go RIGHT across the middle
        7. Curve DOWN at mid-RIGHT
        8. Go DOWN along right side (bottom half)
        9. Curve LEFT at bot-RIGHT
        10. Go LEFT along bottom
        End at bot-LEFT
      
      So the 4 corners of a proper S are:
        Corner A: TOP-LEFT     (line goes left → down) — CCW turn
        Corner B: MID-LEFT     (line goes down → right) — CCW turn
        Corner C: MID-RIGHT    (line goes right → down) — CW turn
        Corner D: BOT-RIGHT    (line goes down → left) — CW turn
      
      Path for outermost S line:
        M (right, top)
        L (left+r, top)              top horizontal going LEFT
        A r,r 0 0,0 (left, top+r)    corner A — CCW (left→down)
        L (left, mid-r)              left vertical (top half)
        A r,r 0 0,0 (left+r, mid)    corner B — CCW (down→right)
        L (right-r, mid)             middle horizontal going RIGHT
        A r,r 0 0,1 (right, mid+r)   corner C — CW (right→down)
        L (right, bot-r)             right vertical (bottom half)
        A r,r 0 0,1 (right-r, bot)   corner D — CW (down→left)
        L (left, bot)                bottom horizontal going LEFT
    -->

    <!-- ============ S GLYPH (corrected) ============ -->

    <path stroke="url(#g-s)" stroke-width="3.2" d="M 380,150 L 124,150 A 44,44 0 0,0 80,194  L 80,356  A 44,44 0 0,0 124,400 L 336,400 A 44,44 0 0,1 380,444 L 380,606 A 44,44 0 0,1 336,650 L 80,650"/>
    <path stroke="url(#g-s)" stroke-width="3.2" d="M 366,164 L 134,164 A 40,40 0 0,0 94,204   L 94,360   A 40,40 0 0,0 134,400 L 326,400 A 40,40 0 0,1 366,440 L 366,596 A 40,40 0 0,1 326,636 L 94,636"/>

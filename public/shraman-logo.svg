    <path stroke="url(#g-s)" stroke-width="3.2" d="M 282,248 L 194,248 A 16,16 0 0,0 178,264  L 178,384  A 16,16 0 0,0 194,400 L 266,400 A 16,16 0 0,1 282,416 L 282,536 A 16,16 0 0,1 266,552 L 178,552"/>
    <path stroke="url(#g-s)" stroke-width="3.2" d="M 268,262 L 204,262 A 12,12 0 0,0 192,274  L 192,388  A 12,12 0 0,0 204,400 L 256,400 A 12,12 0 0,1 268,412 L 268,526 A 12,12 0 0,1 256,538 L 192,538"/>

    <!-- ============ C GLYPH (open on right) ============ -->

    <path stroke="url(#g-c)" stroke-width="3.2" d="M 720,150 L 464,150 A 44,44 0 0,0 420,194 L 420,606 A 44,44 0 0,0 464,650 L 720,650"/>
